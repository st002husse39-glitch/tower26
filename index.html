<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
 <link rel="manifest" href="manifest.json">
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script>
<title>برج 26 - أبراج الصفوة</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7480;--pr:#0f766e;--bd:#e3e6ea;--ok:#15803d;--bad:#b91c1c;--wn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2026;--tx:#eef0f3;--mu:#9aa4b0;--pr:#2dd4bf;--bd:#2b323a;--ok:#4ade80;--bad:#f87171;--wn:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:640px;margin-inline:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 90px}
h1{font-size:19px;margin:4px 0}h2{font-size:16px;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;margin:4px 0}
button{background:var(--pr);color:#fff;border:0;font-weight:600;cursor:pointer}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd);width:auto;padding:6px 12px;font-weight:400;margin:2px}
button.d{background:none;color:var(--bad);width:auto;padding:4px 8px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}.wn{color:var(--wn)}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;z-index:5}
nav button{background:none;color:var(--mu);padding:8px 10px;font-size:14px;white-space:nowrap;flex:1;margin:0;position:relative}
nav button.on{color:var(--pr);font-weight:700}
.dot{position:absolute;top:2px;inset-inline-end:6px;background:var(--bad);color:#fff;border-radius:9px;font-size:11px;padding:0 5px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
#ov{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9}#ov img{max-width:95%;max-height:90%}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.g b{font-size:22px;display:block}
</style>
</head>
<body>
<div id="app">جارٍ التحميل…</div>
<div id="ov" onclick="this.style.display='none'"><img id="oi"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword,updatePassword,EmailAuthProvider,reauthenticateWithCredential} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,onSnapshot,setDoc,updateDoc,deleteDoc,writeBatch,query,where,arrayUnion} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getMessaging,getToken} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const CFG={apiKey:"AIzaSyAR1WLDgsyxZmClQhXwWzyhk-YJDQvCV3Q",authDomain:"safwa-towers-b26.firebaseapp.com",projectId:"safwa-towers-b26",storageBucket:"safwa-towers-b26.firebasestorage.app",messagingSenderId:"39177856586",appId:"1:39177856586:web:40a41d72bc0947caa128b3"};
const VAPID_KEY="";
const ADMIN_EMAIL="admin@burg26.local";
const DOMAIN="@burg26.local";

const app0=initializeApp(CFG),auth=getAuth(app0),db=getFirestore(app0);
const $=s=>document.querySelector(s),root=$('#app');
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>Number(n||0).toLocaleString('ar-EG');
const uidg=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today=()=>new Date().toLocaleDateString('ar-EG');
const month0=()=>new Date().toISOString().slice(0,7);
const UNITS=[...Array.from({length:8},(_,i)=>({id:'S'+(i+1),label:'محل '+(i+1),t:'c'})),
 ...Array.from({length:88},(_,i)=>{const f=Math.floor(i/8)+1,a=i%8+1;return{id:f+'-'+a,label:`دور ${f} شقة ${a}`,t:'r'}})];
const ulabel=id=>(UNITS.find(u=>u.id===id)||{label:id||'—'}).label;
const ST={unpaid:['غير مدفوع','bad'],pending:['قيد المراجعة','wn'],paid:['مدفوع','ok']};
const RS={new:'جديد',prog:'قيد التنفيذ',done:'تم'};
let me=null,admin=false,superadmin=false,tab='ann',M=month0(),duesAddMonth=month0(),S={ann:[],dues:[],req:[],polls:[],votes:[],users:[],expenses:[],set:{}},unsubs=[],seen=+(localStorage.getItem('seen')||0),ready={};
const err=e=>alert('تعذر تنفيذ العملية: '+(e.code||e.message));
const wr=async f=>{try{await f()}catch(e){err(e)}};

function notify(t,b){try{if(Notification.permission==='granted')new Notification(t,{body:b})}catch(e){}}
function sub(key,q,onNew){
  unsubs.push(onSnapshot(q,s=>{
    S[key]=s.docs.map(d=>({id:d.id,...d.data()}));
    if(ready[key]&&onNew)s.docChanges().forEach(c=>onNew(c));
    ready[key]=1;draw();
  },e=>console.warn(key,e.code)));
}
function startData(){
  const c=n=>collection(db,n);
  sub('ann',c('announcements'),c=>{if(c.type==='added'&&!admin)notify('📢 '+c.doc.data().title,c.doc.data().body)});
  sub('polls',c('polls'));sub('votes',c('votes'));
  unsubs.push(onSnapshot(doc(db,'settings','pay'),s=>{S.set=s.data()||{};draw()},()=>{}));
  if(admin){sub('dues',c('dues'),c=>{if(c.doc.data().status==='pending'&&c.type!=='removed')notify('🧾 إيصال جديد',ulabel(c.doc.data().unit))});
    sub('req',c('requests'),c=>{if(c.type==='added')notify('🔧 طلب صيانة',c.doc.data().title)});
sub('users',c('users'));
sub('expenses',superadmin?c('expenses'):query(c('expenses'),where('createdBy','==',auth.currentUser.uid)));
}
  else{sub('dues',query(c('dues'),where('unit','==',me.unit)),c=>{if(c.type==='modified'){const d=c.doc.data();notify('رسوم '+d.month,ST[d.status][0])}});
    sub('req',query(c('requests'),where('uid','==',auth.currentUser.uid)),c=>{if(c.type==='modified')notify('🔧 تحديث الطلب',c.doc.data().title+': '+RS[c.doc.data().status])})}
}
onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());unsubs=[];ready={};me=null;
  if(!u)return loginView();
  superadmin=u.email===ADMIN_EMAIL;
admin=superadmin;
  unsubs.push(onSnapshot(doc(db,'users',u.uid),async s=>{
    if(!s.exists()){
      if(admin){await setDoc(doc(db,'users',u.uid),{name:'مدير العمارة',role:'admin',unit:'',username:'admin'},{merge:true});return}
      root.innerHTML='<div class="card">حسابك غير مفعّل. تواصل مع إدارة العمارة.</div><button onclick="out()">خروج</button>';return}
    const first=!me;me=s.data();if(first){startData()}draw();
  },()=>{}));
});
function loginView(){root.innerHTML=`<h1>🏢 برج 26 — أبراج الصفوة</h1><div class="card"><input id="u" placeholder="اسم المستخدم" autocapitalize="none" autocomplete="username"><input id="p" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button onclick="login()">دخول</button><div id="e" class="bad"></div></div>`}
window.login=async()=>{try{await signInWithEmailAndPassword(auth,$('#u').value.trim().toLowerCase()+DOMAIN,$('#p').value)}catch(e){$('#e').textContent='بيانات الدخول غير صحيحة'}};
window.out=()=>signOut(auth);

function draw(){
  if(!me)return;
  const nAnn=S.ann.filter(a=>a.ts>seen).length;
  const tabs=admin?[['ann','الإعلانات'],['dues','الرسوم'],['req','الطلبات'],['exp','المصروفات'],...(superadmin?[['cash','الصندوق'],['vote','التصويت']]:[]),['res','السكان'],['me','حسابي']]:[['ann','الإعلانات'],['dues','رسومي'],['req','الصيانة'],['vote','التصويت'],['me','حسابي']];
  root.innerHTML=`<div class="row"><h1>🏢 برج 26</h1><button class="s" onclick="out()">خروج</button></div><div class="mu">${esc(me.name)} — ${admin?'مدير':ulabel(me.unit)}</div><div id="v"></div><nav>${tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}${t[0]==='ann'&&nAnn?`<span class="dot">${nAnn}</span>`:''}</button>`).join('')}</nav>`;
  ({ann:vAnn,dues:admin?vDuesA:vDues,req:vReq,exp:vExpenses,cash:vCash,vote:vVote,res:vRes,me:vMe}[tab]||vAnn)();
}
window.go=t=>{
  if(t==='vote'&&admin&&!superadmin){
    tab='ann';
    return draw();
  }

  tab=t;

  if(t==='ann'){
    seen=Date.now();
    localStorage.setItem('seen',seen);
  }

  draw();
};
window.del=(c,id)=>{if(confirm('تأكيد الحذف؟'))wr(()=>deleteDoc(doc(db,c,id)))};

function vAnn(){
  const a=[...S.ann].sort((x,y)=>y.ts-x.ts);
  $('#v').innerHTML=(superadmin?`<div class="card"><input id="t" placeholder="عنوان الإعلان"><textarea id="b" rows="3" placeholder="النص"></textarea><button onclick="addAnn()">نشر</button></div>`:'')+'<h2>الإعلانات</h2>'+(a.map(x=>`<div class="card"><div class="row"><b>${esc(x.title)}</b>${superadmin?`<button class="d" onclick="del('announcements','${x.id}')">حذف</button>`:''}</div><div>${esc(x.body).replace(/\n/g,'<br>')}</div><div class="mu">${esc(x.date)}</div></div>`).join('')||'<div class="mu">لا توجد إعلانات</div>');
}
window.addAnn=()=>{const t=$('#t').value.trim();if(t)wr(()=>setDoc(doc(db,'announcements',uidg()),{title:t,body:$('#b').value,date:today(),ts:Date.now()}))};

function vDues(){
  const d=[...S.dues].sort((a,b)=>b.month.localeCompare(a.month)),owe=d.filter(x=>x.status==='unpaid').reduce((s,x)=>s+(+x.amount||0),0);
  $('#v').innerHTML=`<div class="card"><div class="mu">المتبقي عليك</div><h1 class="${owe?'bad':'ok'}">${owe} جنيه</h1></div>${S.set.text?`<div class="card"><b>طريقة السداد</b><div>${esc(S.set.text).replace(/\n/g,'<br>')}</div></div>`:''}`+(d.map(x=>`<div class="card"><div class="row"><span>${esc(x.month)} · ${esc(x.amount)} جنيه</span><b class="${ST[x.status][1]}">${ST[x.status][0]}</b></div>${x.status==='unpaid'?`<button onclick="pick('${x.id}')">📷 رفع إيصال التحويل</button>`:''}</div>`).join('')||'<div class="mu">لا توجد رسوم</div>')+'<input id="f" type="file" accept="image/*" hidden>';
}
let pid=null;
window.pick=id=>{pid=id;const f=$('#f');f.value='';f.onchange=()=>f.files[0]&&upload(f.files[0]);f.click()};
function upload(file){
  const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const r=c.toDataURL('image/jpeg',.6);if(r.length>800000)return alert('الصورة كبيرة، جرّب صورة أخرى');
    wr(()=>updateDoc(doc(db,'dues',pid),{status:'pending',receipt:r,note:''})).then(()=>alert('تم رفع الإيصال وسيُراجع قريبًا'))};
  im.src=URL.createObjectURL(file);
}
function vDuesA(){
  const l=S.dues.filter(x=>x.month===M);
  const filter=window.duesFilter||'all';
  const unitFilter=window.duesUnitFilter||'all';

  const filtered=l.filter(x=>
    (filter==='all'||x.status===filter)&&
    (unitFilter==='all'||x.unit===unitFilter)
  );

  const n=s=>l.filter(x=>x.status===s).length;

  const rank={
    pending:0,
    unpaid:1,
    paid:2
  };

  const rows=[...filtered].sort((a,b)=>
    (rank[a.status]??9)-(rank[b.status]??9)||
    a.unit.localeCompare(
      b.unit,
      'en',
      {numeric:true}
    )
  );

  $('#v').innerHTML=`
    ${
  superadmin
    ? `
      <div class="card">
        <b>إضافة رسوم جديدة</b>
        <div class="mu">اختر شهر الرسوم الجديدة بشكل مستقل عن شهر إدارة الرسوم والفلترة.</div>
        <input id="addMonth" type="month" value="${window.duesAddMonth||duesAddMonth}" onchange="window.duesAddMonth=this.value">

        <select id="sc">
          <option value="r">
            الشقق السكنية (88)
          </option>

          <option value="c">
            المحلات التجارية (8)
          </option>
        </select>

        <input
          id="am"
          type="number"
          placeholder="المبلغ بالجنيه"
        >

        <button onclick="genDues()">
          إضافة
        </button>
         
<button
  class="d"
  onclick="deleteDuesBatch()"
>
  حذف دفعة رسوم
</button>
      </div>
    `
    : ''
    }
    <h2>إدارة الرسوم</h2>
    <div class="card">
      <input id="m" type="month" value="${M}" onchange="M=this.value;draw()">

      <select onchange="window.duesUnitFilter=this.value;draw()"><option value="all" ${unitFilter==='all'?'selected':''}>كل الوحدات</option>${UNITS.map(u=>`<option value="${u.id}" ${unitFilter===u.id?'selected':''}>${u.label}</option>`).join('')}</select>

      <select
        onchange="window.duesFilter=this.value;draw()"
      >
        <option value="all" ${filter==='all'?'selected':''}>
          كل الطلبات
        </option>

        <option value="pending" ${filter==='pending'?'selected':''}>
          بانتظار المراجعة
        </option>

        <option value="paid" ${filter==='paid'?'selected':''}>
          مدفوع
        </option>

        <option value="unpaid" ${filter==='unpaid'?'selected':''}>
          غير مدفوع
        </option>
      </select>

      <button class="s" onclick="clearDuesFilters()">مسح الفلاتر</button>

      <div class="g">
        <div>
          <b class="ok">${n('paid')}</b>
          مدفوع
        </div>

        <div>
          <b class="wn">${n('pending')}</b>
          بانتظار المراجعة
        </div>

        <div>
          <b class="bad">${n('unpaid')}</b>
          غير مدفوع
        </div>
      </div>
    </div>

    <div class="card">
      <b>طريقة السداد التي تظهر للسكان</b>

      <textarea
        id="pt"
        rows="3"
        placeholder="مثال: حوّل على InstaPay ..."
      >${esc(S.set.text||'')}</textarea>

      <button
        class="s"
        onclick="savePay()"
      >
        حفظ
      </button>
    </div>

    ${
      rows.map(x=>`
        <div class="card">
          <div class="row">
            <span>
              <b>${esc(ulabel(x.unit))}</b>
              · ${esc(x.amount)} جنيه
            </span>

            <b class="${ST[x.status][1]}">
              ${ST[x.status][0]}
            </b>
          </div>

          ${
            x.desc
              ? `<div class="mu">📝 ${esc(x.desc)}</div>`
              : ''
          }

          <div>
            ${
              x.receipt
                ? `<button
                     class="s"
                     onclick="rc('${x.id}')"
                   >
                     عرض الإيصال
                   </button>`
                : ''
            }

            ${
              !superadmin&&x.status!=='paid'
                ? `<button
                     class="s"
                     onclick="confirmCashDue('${x.id}')"
                   >
                     ✓ تأكيد الدفع
                   </button>`
                : ''
            }
            
            ${
  superadmin&&x.status==='paid'
    ? `<button
         class="d"
         onclick="confirmDuesReset('${x.id}')"
       >
         إعادة إلى قيد المراجعة
       </button>`
    : ''
}

            ${
  !superadmin&&x.status==='pending'
    ? `<button
         class="s"
         onclick="confirmRejectReceipt('${x.id}')"
       >
         ✕ رفض الإيصال
       </button>`
    : ''
}


          </div>
        </div>
      `).join('')
      || '<div class="mu">لا توجد رسوم بهذا الفلتر</div>'
    }
  `;
}

window.M=M;Object.defineProperty(window,'M',{get:()=>M,set:v=>{M=v}});window.draw=draw;
window.clearDuesFilters=()=>{M=month0();window.duesFilter='all';window.duesUnitFilter='all';draw()};
window.savePay=()=>wr(()=>setDoc(doc(db,'settings','pay'),{text:$('#pt').value}));
window.setD=(id,s)=>wr(()=>updateDoc(doc(db,'dues',id),s==='paid'?{status:s,paidAt:today()}:{status:s,receipt:'',note:''}));
window.confirmCashDue=id=>{
  if(superadmin){
    return alert('السوبر يوزر لا يملك صلاحية تأكيد التحصيل النقدي');
  }

  const d=S.dues.find(x=>x.id===id);

  if(!d){
    return alert('لم يتم العثور على الرسم المطلوب');
  }

  const ok=confirm(
    'تنبيه: أنت على وشك تأكيد تحصيل مبلغ الرسوم نقديًا.'
    +'\n\nالوحدة: '+ulabel(d.unit)
    +'\nالشهر: '+d.month
    +'\nالمبلغ: '+d.amount+' جنيه'
    +'\n\nهل تريد تأكيد التنفيذ؟'
  );

  if(!ok)return;

  setD(id,'paid');
};

window.confirmRejectReceipt=id=>{
  if(!admin){
    return alert('ليس لديك صلاحية رفض الإيصال');
  }

  const d=S.dues.find(x=>x.id===id);

  if(!d){
    return alert('لم يتم العثور على الرسم المطلوب');
  }

  if(d.status!=='pending'){
    return alert('هذا الرسم ليس في حالة قيد المراجعة');
  }

  const ok=confirm(
    'تنبيه: أنت على وشك تغيير حالة الرسم من «قيد المراجعة» إلى «غير مدفوع».'+
    '\n\nالوحدة: '+ulabel(d.unit)+
    '\nالشهر: '+d.month+
    '\nالمبلغ: '+d.amount+' جنيه'+
    '\n\nسيتم رفض الإيصال وإزالته. هل تريد المتابعة؟'
  );

  if(!ok){
    return;
  }

  wr(async()=>{
    await updateDoc(
      doc(db,'dues',id),
      {
        status:'unpaid',
        receipt:'',
        note:''
      }
    );

    const users=S.users.filter(x=>
      x.role!=='admin'&&
      x.unit===d.unit
    );

    const u=
      users.find(x=>waNum(x.contactPhone))||
      users[0];

    const ph=waNum(u&&u.contactPhone);

    if(!ph){
      return alert(
        'تم رفض الإيصال، لكن لا يوجد رقم تواصل لهذه الوحدة.'
      );
    }

    const msg=
      'السيد/ '+((u&&u.name)||'الساكن')+
      ' — '+ulabel(d.unit)+
      '\nتم رفض إيصال التحويل الخاص برسوم شهر '+
      d.month+
      ' بمبلغ '+d.amount+
      ' جنيه.'+
      '\nبرجاء فتح التطبيق والتأكد من إرفاق إيصال التحويل الخاص بكم بشكل صحيح.'+
      '\nشكرًا لكم.'+
      '\nإدارة برج 26 — أبراج الصفوة';

    if(confirm(
      'تم رفض الإيصال بنجاح. هل تريد فتح واتساب لإبلاغ الساكن؟'
    )){
      window.open(
        'https://wa.me/'+
        ph+
        '?text='+
        encodeURIComponent(msg),
        '_blank'
      );
    }
  });
};

window.confirmDuesReset=id=>{
  if(!superadmin){
    return alert('ليس لديك صلاحية إعادة حالة الرسم');
  }

  const d=S.dues.find(x=>x.id===id);

  if(!d){
    return alert('لم يتم العثور على الرسم المطلوب');
  }

  if(d.status!=='paid'){
    return alert('هذا الرسم ليس في حالة مدفوع');
  }

  const ok=confirm(
    'تنبيه: أنت على وشك تغيير حالة الرسم من «مدفوع» إلى «قيد المراجعة».'
    +'\n\nالوحدة: '+ulabel(d.unit)
    +'\nالشهر: '+d.month
    +'\nالمبلغ: '+d.amount+' جنيه'
    +'\n\nسيظل إيصال التحويل محفوظًا حتى يراجعه أمين الصندوق. هل تريد المتابعة؟'
  );

  if(!ok){
    return;
  }

  wr(async()=>{
    await updateDoc(
      doc(db,'dues',id),

window.editResident=async(id)=>{
   if(!superadmin){

  }

  const user=S.users.find(x=>x.id===id);

 function readExpenseReceipt(file){
  if(!file)return Promise.resolve('');
  if(!file.type.startsWith('image/'))return Promise.reject(new Error('اختر صورة إيصال فقط'));
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error('تعذر قراءة صورة الإيصال'));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>reject(new Error('ملف الإيصال غير صالح'));
      im.onload=()=>{
        const k=Math.min(1,1000/Math.max(im.width,im.height));
        const c=document.createElement('canvas');
        c.width=im.width*k;c.height=im.height*k;
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        const r=c.toDataURL('image/jpeg',.65);
        if(r.length>800000)return reject(new Error('الصورة كبيرة، جرّب صورة أخرى'));
        resolve(r);
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

window.genDues=()=>{
  if(!superadmin){
    return alert('ليس لديك صلاحية إضافة رسوم جديدة');
  }

  const amount=+$('#am').value;
  const addMonth=window.duesAddMonth||duesAddMonth;
  const type=$('#sc').value;
  const desc=($('#ds')?$('#ds').value:'').trim();

  if(!amount||amount<=0){
    return alert('أدخل مبلغًا صحيحًا');
  }
  if(!addMonth){
    return alert('اختر شهر الرسوم الجديدة');
  }

  const units=UNITS.filter(u=>u.t===type);

  if(!units.length){
    return alert('لا توجد وحدات لهذا النوع');
  }

  const batchId='dues_'+addMonth+'_'+type+'_'+uidg();

  wr(async()=>{

window.deleteDuesBatch=()=>{
  if(!superadmin){
    return alert('ليس لديك صلاحية حذف الرسوم');
  }

  const groups={};

  S.dues
    .filter(x=>x.month===(window.duesAddMonth||duesAddMonth)&&x.batchId)
    .forEach(x=>{
      if(!groups[x.batchId]){
        groups[x.batchId]={
          id:x.batchId,
          month:x.month,
          type:x.batchType||'',
          amount:x.amount,
          rows:[]
        };
      }

      groups[x.batchId].rows.push(x);
    });

  const batches=Object.values(groups);

  if(!batches.length){
    return alert(
      'لا توجد دفعات مرتبطة بشهر الإضافة المحدد وقابلة للإدارة'
    );
  }

  const list=batches.map((b,i)=>
    (i+1)+') '+
    b.month+
    ' — '+
    (
      b.type==='r'
        ? 'الشقق السكنية'
        : b.type==='c'
          ? 'المحلات التجارية'
          : 'نوع غير محدد'
    )+
    ' — '+
    b.amount+
    ' جنيه — '+
    b.rows.length+
    ' وحدة'
  ).join('\n');

  const answer=prompt(
    'اختر رقم الدفعة التي تريد حذفها:\n\n'+
    list
  );

  if(answer===null)return;

  const index=Number(answer)-1;
  const batch=batches[index];

  if(!batch){
    return alert('رقم الدفعة غير صحيح');
  }

  const blocked=batch.rows.find(x=>
    x.status!=='unpaid'||!!x.receipt
  );

  if(blocked){
    return alert(
      'لا يمكن حذف الدفعة؛ لأن أحد رسومها مدفوع أو قيد المراجعة أو لديه إيصال.'
    );
  }

  const ok=confirm(
    'تحذير: سيتم حذف '+
    batch.rows.length+
    ' رسمًا لشهر '+
    batch.month+
    ' بمبلغ '+
    batch.amount+
    ' جنيه نهائيًا. هل أنت متأكد؟'
  );

  if(!ok)return;

  wr(async()=>{
    const b=writeBatch(db);

    batch.rows.forEach(x=>{
      b.delete(doc(db,'dues',x.id));
    });

    await b.commit();

    alert(
      'تم حذف دفعة الرسوم بنجاح'
    );
  });
};

      head:['الوحدة','الساكن','المبلغ','الحالة','تاريخ السداد'],
      rows:[...l].sort((a,b)=>a.unit.localeCompare(b.unit,'en',{numeric:true})).map(x=>[ulabel(x.unit),unitName(x.unit),x.amount,stL(x.status),x.paidAt||''])};

    return{title:'كشف المتأخرات',
      sum:[['عدد الوحدات المتأخرة',ks.filter(k=>g[k].a>0).length],['إجمالي المتأخرات',ks.reduce((s,k)=>s+g[k].a,0)],['قيد المراجعة',ks.reduce((s,k)=>s+g[k].p,0)]],

      rows:ks.map(k=>[ulabel(k),unitName(k),g[k].n,g[k].a,g[k].p])};
  }
  const l=D.filter(x=>x.unit===rp.u&&(rp.y==='all'||x.month.startsWith(rp.y))).sort((a,b)=>a.month.localeCompare(b.month));
  const sm=f=>l.filter(f).reduce((s,x)=>s+num(x),0);

}

      {name:'قائمة التسليم',head:['الوحدة','الساكن','التفاصيل','المبلغ'],rows:o.filter(x=>x.status==='paid').map(x=>[ulabel(x.unit),un(x),pjLine(x),x.total])},
      {name:'كل الطلبات',all:1,head:['الوحدة','الساكن','التفاصيل','الإجمالي','الحالة'],rows:o.map(x=>[ulabel(x.unit),un(x),pjLine(x),x.total,PS[x.status][0]])}
    ]};
}
const pjTbl=s=>`<div class="card" style="overflow-x:auto"><b>${esc(s.name)}</b><table class="pjt"><tr>${s.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${s.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${s.head.length}" class="mu">لا توجد بيانات</td></tr>`}</table></div>`;
function pjView(d){
  return `<div class="noprint row"><button class="s" onclick="pjBack()">← رجوع</button><button class="s" onclick="pjExp()">📤 تصدير التقرير</button></div><div class="card"><div class="mu">برج 26 — أبراج الصفوة · ${new Date().toLocaleDateString('ar-EG')}</div><h2 style="margin-top:4px">${esc(d.title)}</h2>${d.sum.map(r=>`<div class="row"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join('')}</div>`
    +d.secs.map(s=>s.all?`<div class="pjp">${pjTbl(s)}</div>`:pjTbl(s)).join('');
}
window.pjExp=()=>{
  const o=document.createElement('div');o.id='pjem';
  o.style.cssText='position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px';
  o.innerHTML=`<div class="card" style="width:100%;max-width:360px"><h2 style="margin-top:0">تصدير التقرير</h2><button onclick="pjDo(1)">📊 Excel</button><button onclick="pjDo(2)">📄 PDF</button><button class="s" style="width:100%" onclick="document.getElementById('pjem').remove()">إلغاء</button></div>`;
  o.onclick=e=>{if(e.target===o)o.remove()};
  document.body.appendChild(o);
};
window.pjDo=k=>{
  const m=document.getElementById('pjem');if(m)m.remove();
  if(k===2)return setTimeout(()=>window.print(),150);
  const d=pjRep();
  const go=()=>{
    const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([[d.title],...d.sum]),'ملخص');
    d.secs.forEach((s,i)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([s.head,...s.rows]),(s.name||'ورقة'+i).replace(/[\\\/?*\[\]:]/g,'').slice(0,28)));
    XLSX.writeFile(wb,'project-report.xlsx');
  };
  if(window.XLSX)return go();
  const sc=document.createElement('script');
  sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  sc.onload=go;sc.onerror=()=>alert('تعذر تحميل مكتبة Excel، تحقق من الإنترنت');
  document.head.appendChild(sc);
};

/* المدير: إدارة طلبات مشروع */
function pjAdminProj(){
  if(pjSel==='*')return pjView(pjRep());
  const p=S.pj.find(x=>x.id===pjSel);
  if(!p){return '<div class="mu">جارٍ التحميل…</div><button class="s" onclick="pjBack()">← رجوع</button>'}
  const rk={pending:0,paid:1,new:2,done:3};
  const os=S.po.filter(x=>x.pid===p.id&&x.status!=='cancelled'&&(pjFl==='all'||x.status===pjFl)).sort((a,b)=>(rk[a.status]-rk[b.status])||pjSort(a,b));
  const fl=[['all','كل الطلبات'],['pending','بانتظار المراجعة'],['new','غير مسدد'],['paid','بانتظار التسليم'],['done','تم التسليم']];
  const cards=os.map(o=>{
    const st=PS[o.status],u=pjUser(o.unit);
    return `<div class="card"><div class="row"><b>${esc(ulabel(o.unit))}${u.name?' — '+esc(u.name):''}</b><b class="${st[1]}">${st[0]}</b></div><div>${esc(pjLine(o))}</div><div class="mu">${o.kind==='base'?'الطلب الأساسي':'طلب إضافات'} · الإجمالي <b>${o.total}</b> جنيه</div><div>${o.receipt?`<button class="s" onclick="pjRc('${o.id}')">عرض الإيصال</button>`:''}${!superadmin&&(o.status==='new'||o.status==='pending')?`<button class="s" onclick="confirmCashProject('${o.id}')">✓ تأكيد استلام المبلغ</button>`:''}${!superadmin&&o.status==='pending'?`<button class="s" onclick="pjSet('${o.id}','new')">✕ رفض الإيصال</button>`:''}${o.status==='paid'?`<button class="s" onclick="pjSet('${o.id}','done')">📦 تأكيد التسليم/التنفيذ</button>`:''}${superadmin&&o.status==='paid'?`<button class="d" onclick="confirmProjectReset('${o.id}')">إعادة إلى قيد المراجعة</button>`:''}</div></div>`;
  }).join('')||'<div class="mu">لا توجد طلبات</div>';
  return pjView(pjRep())+`<div class="noprint"><h2>إدارة الطلبات</h2><select onchange="pjFilt(this.value)">${fl.map(f=>`<option value="${f[0]}" ${pjFl===f[0]?'selected':''}>${f[1]}</option>`).join('')}</select>${cards}</div>`;
}
window.pjFilt=v=>{pjFl=v;pjRe()};
window.pjRc=id=>{
  const o=S.po.find(x=>x.id===id);if(!o||!o.receipt)return;
  const d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:30';
  d.innerHTML='<img src="'+o.receipt+'" style="max-width:95%;max-height:90%">';
  d.onclick=()=>d.remove();document.body.appendChild(d);
};

window.confirmCashProject=id=>{
  if(superadmin){
    return alert('السوبر يوزر لا يملك صلاحية تأكيد التحصيل النقدي');
  }

  const o=S.po.find(x=>x.id===id);

  if(!o){
    return alert('لم يتم العثور على طلب المشروع');
  }

  const p=S.pj.find(x=>x.id===o.pid);

  const ok=confirm(
    'تنبيه: أنت على وشك تأكيد تحصيل مبلغ المشروع نقديًا.'

    +'\nالمشروع: '+((p&&p.name)||o.pname||'مشروع')
    +'\nالإجمالي: '+(o.total||0)+' جنيه'
    +'\n\nهل تريد تأكيد التنفيذ؟'
  );

  if(!ok)return;

  pjSet(id,'paid');
};
 window.confirmProjectReset=id=>{
  if(!superadmin){
    return alert('ليس لديك صلاحية إعادة حالة الطلب');
  }

  const o=S.po.find(x=>x.id===id);

  if(!o){
    return alert('لم يتم العثور على طلب المشروع');
  }

  if(o.status!=='paid'){
    return alert('هذا الطلب ليس في حالة تم استلام المبلغ');
  }

  const p=S.pj.find(x=>x.id===o.pid);

  const ok=confirm(
    'تنبيه: أنت على وشك تحويل حالة الطلب من «تم استلام المبلغ» إلى «قيد المراجعة» وإعادته إلى أمين الصندوق للمراجعة.'
    +'\n\nالوحدة: '+ulabel(o.unit)
    +'\nالمشروع: '+((p&&p.name)||o.pname||'مشروع')
    +'\nالإجمالي: '+(o.total||0)+' جنيه'
    +'\n\nسيظل إيصال التحويل محفوظًا. هل تريد المتابعة؟'
  );

  if(!ok){
    return;
  }

  wr(async()=>{
    await updateDoc(
      doc(db,'orders',id),
      {
        status:'pending',
        paidAt:null
      }
    );

    alert(
      'تم تحويل حالة الطلب إلى قيد المراجعة، وأصبح ظاهرًا لأمين الصندوق.'
    );
  });
};

window.pjSet=(id,s)=>{
  const o=S.po.find(x=>x.id===id);

  if(!o)return;

  if(
    s==='new' &&
    o.status==='pending' &&
    !superadmin
  ){
    const ok=confirm(
      'تنبيه: أنت على وشك رفض إيصال هذا الطلب وتحويل حالته من «قيد المراجعة» إلى «غير مسدد».'
      +'\n\nالوحدة: '+ulabel(o.unit)
      +'\nالمشروع: '+(o.pname||'مشروع')
      +'\nالإجمالي: '+(o.total||0)+' جنيه'
      +'\n\nسيتم حذف الإيصال المحفوظ، وسيُطلب من الساكن رفع إيصال صحيح.'
      +'\n\nهل تريد تأكيد الرفض؟'
    );

    if(!ok)return;
  }

  if(s==='cancelled'&&!confirm('إلغاء هذا الطلب؟'))return;

  const data={status:s};

  if(s==='new'){
    data.receipt='';
  }

  if(s==='paid'){
    data.paidAt=today();
  }

  if(s==='done'){
    data.doneAt=today();
  }

  wr(async()=>{
    await updateDoc(
      doc(db,'orders',id),
      data
    );

    if(s==='paid'){
      pjPaidMsg(o);
    }

    if(s==='done'){
      pjMsg(o);
    }

    if(
      s==='new' &&
      o.status==='pending' &&
      !superadmin
    ){
      pjRejectMsg(o);
    }
  });
};

/* الساكن */
function pjRes(){
  const ps=S.pj.slice().sort((a,b)=>b.ts-a.ts).filter(p=>p.shops||!/^S/.test(me.unit));
  return ps.map(pjResCard).join('')||'<div class="mu">لا توجد مشاريع حاليًا</div>';
}
function pjResCard(p){
  const os=S.po.filter(x=>x.pid===p.id&&x.unit===me.unit&&x.status!=='cancelled').sort((a,b)=>a.ts-b.ts);
  const base=os.find(x=>x.kind==='base');
  let h=`<div class="card"><div class="row"><b>${esc(p.name)}</b><span class="mu">${p.mandatory?'إجباري':'اختياري'}${p.open?'':' · مغلق'}</span></div>${p.desc?`<div>${esc(p.desc).replace(/\n/g,'<br>')}</div>`:''}<div class="mu">التكلفة الأساسية: ${p.base} جنيه${p.baseDesc?' — '+esc(p.baseDesc):''}${p.deadline?' · آخر موعد: '+esc(p.deadline):''}</div>`;
  if(!base&&!p.mandatory&&p.open)h+=`<button onclick="pjJoin('${p.id}')">أرغب في المشاركة</button>`;
  h+=os.map(o=>pjOrd(o,p)).join('');
  if(base&&base.status!=='new'&&(p.addons||[]).length&&p.open&&!os.some(x=>x.kind==='extra'&&x.status==='new'))h+=`<button class="s" onclick="pjExtra('${p.id}')">+ طلب إضافات جديد</button>`;
  return h+'</div>';
}
function pjOrd(o,p){
  const st=PS[o.status]||['مسودة','mu'];

  let h=`
    <div style="border-top:1px solid var(--bd);margin-top:8px;padding-top:8px">
      <div class="row">
        <b>${o.kind==='base'?'طلبي':'طلب إضافات'}</b>
        <b class="${st[1]}">${st[0]}</b>
      </div>
  `;

  if(o.status==='new'||o.status==='draft'){
    const dr=pjDr[o.id]||(pjDr[o.id]=Object.fromEntries(
      (p.addons||[]).map((a,i)=>[
        i,
        ((o.items||[]).find(x=>x.n===a.n)||{}).q||0
      ])
    ));

    h+=
      (
        o.kind==='base'
          ? `<div class="row">
               <span>${esc(o.items[0].n)}</span>
               <span>${o.items[0].p} جنيه</span>
             </div>`
          : ''
      )

      +(p.addons||[]).map((a,i)=>`
        <div class="row">
          <span>
            ${esc(a.n)}
            <span class="mu">
              ${a.p} جنيه (حتى ${a.m})
            </span>
          </span>

          <span>
            <button
              class="s"
              onclick="pjQ('${o.id}',${i},-1,${a.m})"
            >
              −
            </button>

            <b>${dr[i]}</b>

            <button
              class="s"
              onclick="pjQ('${o.id}',${i},1,${a.m})"
            >
              +
            </button>
          </span>
        </div>
      `).join('')

      +`<h2>الإجمالي: ${pjCalc(o,p)} جنيه</h2>`

      +`<button
           class="s"
           style="width:100%"
           onclick="pjSave('${o.id}')"
        >
           حفظ الاختيارات
        </button>`

      +`<div class="mu">
           بعد حفظ الاختيارات، انتقل إلى تبويب «رسومي»
           لرفع إيصال التحويل.
        </div>`;
  }else{
    h+=`
      <div class="mu">
        ${esc(pjLine(o))}
      </div>

      <div>
        الإجمالي:
        <b>${o.total||0}</b> جنيه
      </div>
    `;
  }

  return h+'</div>';
}
window.pjQ=(id,i,d,m)=>{const dr=pjDr[id];if(!dr)return;dr[i]=Math.max(0,Math.min(m,(dr[i]||0)+d));pjRe()};
window.pjSave=async id=>{
  const b=pjBuild(id);

  try{
    await updateDoc(
      doc(db,'orders',id),
      {
        items:b.items,
        total:b.total,
        status:'draft'
      }
    );

    const local=S.po.find(x=>x.id===id);

    if(local){
      local.items=b.items;
      local.total=b.total;
      local.status='draft';
    }

    alert('تم حفظ الاختيارات كمسودة. انتقل إلى تبويب رسومي لمراجعة المديونية ورفع الإيصال.');

    pjRe();
  }catch(e){
    err(e);
  }
};
window.pjJoin=pid=>{
  const p=S.pj.find(x=>x.id===pid);if(!p)return;
  wr(()=>setDoc(doc(db,'orders',pid+'_'+me.unit),{pid,pname:p.name,unit:me.unit,kind:'base',items:[{n:p.name+' (الأساسي'+(p.baseDesc?' — '+p.baseDesc:'')+')',p:p.base,q:1,base:1}],total:p.base,status:'draft',ts:Date.now()}));
};
window.pjExtra=pid=>{
  const p=S.pj.find(x=>x.id===pid);if(!p)return;
  wr(()=>setDoc(doc(db,'orders',pid+'_'+me.unit+'_'+uidg()),{pid,pname:p.name,unit:me.unit,kind:'extra',items:[],total:0,status:'draft',ts:Date.now()}));
};
window.pjPick=id=>{
  if(!(pjBuild(id).total>0))return alert('اختر بندًا أولًا');
  const f=document.createElement('input');f.type='file';f.accept='image/*';
  f.onchange=()=>f.files[0]&&pjUp(id,f.files[0]);f.click();
};
function pjUp(id,file){
  const im=new Image();
  im.onload=()=>{
    const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const r=c.toDataURL('image/jpeg',.6);
    if(r.length>800000)return alert('الصورة كبيرة، جرّب صورة أخرى');
    const b=pjBuild(id);
    (async()=>{
  try{
    await updateDoc(
      doc(db,'orders',id),
      {
        items:b.items,
        total:b.total,
        status:'pending',
        receipt:r
      }
    );

    alert('تم رفع الإيصال وتحويل الطلب إلى قيد المراجعة');
  }catch(e){
    err(e);
  }
})();

  };
  im.src=URL.createObjectURL(file);
}
pjW();pjSync();
</script>
